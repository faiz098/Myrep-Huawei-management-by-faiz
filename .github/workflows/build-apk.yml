name: Build MYREP Huawei Management APK

on:
  workflow_dispatch:
  push:
    branches:
      - work/v3-huawei-audit

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V3 source
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q MyRepHuaweiManagement-source-v3.zip -d extracted
          echo "Archive files:"
          find extracted -maxdepth 6 -type f -print
          PROJECT_DIR="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Gradle settings file was not found in the V3 archive."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Kotlin and Java JVM targets
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ -f app/build.gradle.kts ]; then
            printf '\nkotlin { compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8) } }\n' >> app/build.gradle.kts
          else
            echo "::error::Expected app/build.gradle.kts was not found."
            exit 1
          fi

      - name: Inspect Kotlin source around reported error
        shell: bash
        run: |
          sed -n '70,95p' "$PROJECT_DIR/app/src/main/java/id/myrep/huaweimanager/MainActivity.kt"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myrep-huawei-management-debug-apk
          path: '${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
